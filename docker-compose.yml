version: '3.9'

services:
  enem-pro:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enem-pro
    ports:
      - "3101:3101"
    environment:
      NODE_ENV: production
      APP_VERSION: "1.0.0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3101"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

name: Full Deployment Pipeline (Build → Staging → Approval → Production)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: .next
          retention-days: 1

  docker-build-push:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/enem-pro:latest
            ghcr.io/${{ github.repository_owner }}/enem-pro:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/enem-pro:${{ github.ref_name }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/enem-pro:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/enem-pro:buildcache,mode=max

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create .env.staging
        run: |
          cat > .env.staging << EOF
          NODE_ENV=staging
          ENVIRONMENT=staging
          EOF
      - name: Pull and deploy to staging
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/enem-pro:${{ github.sha }}
          docker-compose -f docker-compose.yml \
            -e IMAGE_TAG=${{ github.sha }} \
            up -d enem-pro
      - name: Wait for health check
        run: |
          for i in {1..30}; do
            if docker inspect --format='{{.State.Health.Status}}' enem-pro | grep -q "healthy"; then
              echo "✓ Service is healthy"
              exit 0
            fi
            echo "Waiting for service to be healthy... ($i/30)"
            sleep 2
          done
          echo "✗ Service failed to become healthy"
          docker logs enem-pro
          exit 1
      - name: Smoke test staging
        run: |
          curl -f http://localhost:3101 || exit 1

  approval-gate:
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment:
      name: production
    steps:
      - name: Request production approval
        run: |
          echo "⏳ Manual approval requested for production deployment"
          echo "Deployment Info:"
          echo "  Ref: ${{ github.ref }}"
          echo "  SHA: ${{ github.sha }}"
          echo "  Image: ghcr.io/${{ github.repository_owner }}/enem-pro:${{ github.sha }}"

  deploy-production:
    runs-on: ubuntu-latest
    needs: [approval-gate]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Create GitHub Deployment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: 0,
              state: 'success',
              description: 'Production deployment successful',
              environment_url: 'https://enem-pro.vercel.app'
            }).catch(() => {
              console.log('Deployment status recorded');
            });

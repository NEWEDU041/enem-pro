version: '3.9'

services:
  # Redis for Bull queues
  redis:
    image: redis:7-alpine
    container_name: enem-pro-redis
    networks:
      - enem-pro-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    # Uncomment to expose locally for debugging
    # ports:
    #   - "6379:6379"
    volumes:
      - enem_pro_redis:/data
    command: redis-server --appendonly yes

  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: enem-pro-postgres
    environment:
      POSTGRES_USER: enem_pro
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: enem_pro
    volumes:
      - enem_db:/var/lib/postgresql/data
    networks:
      - enem-pro-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enem_pro"]
      interval: 10s
      timeout: 3s
      retries: 3
    # Optional: uncomment to expose locally
    # ports:
    #   - "5432:5432"

  # ENEM Pro App — with database initialization
  enem-pro:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enem-pro
    ports:
      - "3101:3101"
    networks:
      - enem-pro-net
    environment:
      NODE_ENV: production
      APP_VERSION: "1.0.0"
      # Database credentials for init script
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_USER: enem_pro
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: enem_pro
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3101"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    volumes:
      - enem-pro-data:/app/data
      - ./scripts:/app/scripts:ro  # Mount init scripts (read-only)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: /bin/bash
    command: >
      -c "[ -f /app/scripts/docker-entrypoint.sh ] && bash /app/scripts/docker-entrypoint.sh npm start || npm start"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  enem-pro-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  enem-pro-data:
    driver: local
  enem_db:
    driver: local
  enem_pro_redis:
    driver: local

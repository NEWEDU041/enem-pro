version: '3.9'

services:
  redis:
    image: redis:7.4-alpine
    container_name: enem-pro-redis
    ports:
      - '6379:6379'
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
      --appendfsync everysec
      --loglevel notice
    volumes:
      - redis-data:/data
    networks:
      - enem-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    # Label for monitoring
    labels:
      name: enem-pro-redis
      version: '7.4'

networks:
  enem-network:
    driver: bridge

volumes:
  redis-data:
    driver: local

name: 📡 Submit Sitemaps to GSC

on:
  push:
    branches:
      - master
    paths:
      - 'app/sitemap.ts'
      - 'app/robots.ts'
      - 'app/api/sitemap-index/route.ts'
  schedule:
    # Run daily at 9 AM UTC (6 AM -03)
    - cron: '0 9 * * *'
  workflow_dispatch:

# NOTE: Google e Bing desativaram o endpoint /ping?sitemap= (2023).
# A submissão real é feita via API do Search Console (job submit-to-gsc no deploy.yml)
# ou manualmente em https://search.google.com/search-console. Aqui só validamos.

jobs:
  verify-sitemaps:
    runs-on: ubuntu-latest
    steps:
      - name: 📊 Verify sitemap.xml
        run: |
          echo "🔍 Checking https://questoesenem.pro/sitemap.xml ..."
          body=$(curl -sS --fail --max-time 30 "https://questoesenem.pro/sitemap.xml")
          echo "$body" | grep -q "<urlset" || { echo "❌ sitemap.xml inválido"; exit 1; }
          count=$(echo "$body" | grep -c "<loc>")
          echo "✅ sitemap.xml OK — $count URLs"
          if [ "$count" -lt 400 ]; then
            echo "⚠️  Menos de 400 URLs — verifique se o build está atualizado / se app/sitemap.ts não está estourando maxDuration"
          fi

      - name: 📊 Verify sitemap index
        run: |
          echo "🔍 Checking https://questoesenem.pro/api/sitemap-index ..."
          curl -sS --fail --max-time 30 "https://questoesenem.pro/api/sitemap-index" | grep -q "<sitemapindex" \
            && echo "✅ sitemap-index OK" || { echo "❌ sitemap-index inválido"; exit 1; }

      - name: 📊 Verify robots.txt points to the right sitemap
        run: |
          echo "🔍 Checking https://questoesenem.pro/robots.txt ..."
          robots=$(curl -sS --fail --max-time 30 "https://questoesenem.pro/robots.txt")
          echo "$robots"
          echo "$robots" | grep -q "Sitemap: https://questoesenem.pro/sitemap.xml" \
            && echo "✅ robots.txt OK" || { echo "❌ robots.txt não aponta para o sitemap correto"; exit 1; }

      - name: 🔔 Notify via Slack (if configured)
        if: always()
        run: |
          if [ ! -z "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
              -H 'Content-Type: application/json' \
              -d "{\"text\":\"📡 Sitemap check concluído — https://search.google.com/search-console\"}"
          fi
